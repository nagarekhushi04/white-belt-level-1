name: Soroban dApp CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Soroban (Stellar) CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/stellar/stellar-cli/main/scripts/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Lint and Format
        working-directory: ./contract
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Run Contract Tests
        working-directory: ./contract
        run: cargo test

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build Frontend
        run: npm run build
